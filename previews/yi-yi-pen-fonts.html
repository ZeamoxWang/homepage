      max-width: 768px;

    .yi-yi img {
      display: block;
      width: 100%;
      height: auto;
    }

    .yi-yi blockquote {
      margin: 0;
    }

    .yi-yi-still {
      position: relative;
    }

    .yi-yi-still::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg,
        rgba(246, 248, 243, 0.64) 0%,
        rgba(246, 248, 243, 0.58) 22%,
        rgba(246, 248, 243, 0.54) 38%,
        rgba(246, 248, 243, 0.12) 46%,
        rgba(246, 248, 243, 0) 56%);
      pointer-events: none;
    }

    .yi-yi-chinese {
      position: absolute;
      z-index: 1;
      top: 50%;
      left: 4%;
      width: 34%;
      margin: 0;
      transform: translateY(-50%);
      color: #101b15;
      font-family: 'Yi Yi Handwriting', 'LXGW WenKai', cursive;
      font-size: 1.067rem;
      line-height: 1.85;
      text-wrap: pretty;
    }

    .yi-yi-chinese span {
      display: block;
    }

    .yi-yi-chinese span + span {
      margin-top: 12px;
    }

    .yi-yi-english {
      margin: 20px 0 0;
      color: #59616a;
      font-family: 'Lora', serif;
      font-size: 1rem;
      line-height: 1.75;
    }

    .yi-yi-ending {
      white-space: nowrap;
    }

    .yi-yi-attribution {
      display: inline-block;
      margin-left: 0.65em;
      font-size: 0.933rem;
      white-space: nowrap;
    }

      .yi-yi-still::after {
        display: none;
      }

      .yi-yi-chinese {
        position: static;
        width: auto;
        margin-top: 20px;
        transform: none;

</main><script>
const buttons = [...document.querySelectorAll('[data-choice]')];
const samples = [...document.querySelectorAll('[data-font]')];
function show(choice) {
 if (!['all', 'A', 'B', 'C', 'D'].includes(choice)) choice = 'all';
 for (const button of buttons) button.setAttribute('aria-pressed', String(button.dataset.choice === choice));
 for (const sample of samples) sample.hidden = choice !== 'all' && sample.dataset.font !== choice;
 document.querySelector('.samples').classList.toggle('single', choice !== 'all');
}
for (const button of buttons) button.addEventListener('click', () => {
 show(button.dataset.choice);
 history.replaceState(null, '', '#' + button.dataset.choice);
});
window.addEventListener('hashchange', () => show(location.hash.slice(1)));
show(location.hash.slice(1));
</script></body></html>
